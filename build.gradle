plugins {
    id 'java'
    id 'org.jetbrains.intellij' version '0.7.3'
}

group 'com.codereview'
version '1.1.0'

sourceCompatibility = 8
targetCompatibility = 8

repositories {
    mavenCentral()
    gradlePluginPortal()
    maven { url "https://dl.bintray.com/jetbrains/intellij-plugin-service" }
}

// 配置Wrapper任务
wrapper {
    gradleVersion = '6.8.3'
    distributionType = Wrapper.DistributionType.BIN
}

dependencies {
    implementation 'com.google.code.gson:gson:2.8.9'
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
    
    // Spring Web - 提供RestTemplate支持，排除Jackson避免版本冲突
    implementation('org.springframework:spring-web:5.3.23') {
        exclude group: 'com.fasterxml.jackson.core', module: 'jackson-core'
        exclude group: 'com.fasterxml.jackson.core', module: 'jackson-databind'
        exclude group: 'com.fasterxml.jackson.core', module: 'jackson-annotations'
        exclude group: 'com.fasterxml.jackson.module', module: 'jackson-module-kotlin'
    }
    implementation('org.springframework:spring-webmvc:5.3.23') {
        exclude group: 'com.fasterxml.jackson.core', module: 'jackson-core'
        exclude group: 'com.fasterxml.jackson.core', module: 'jackson-databind'
        exclude group: 'com.fasterxml.jackson.core', module: 'jackson-annotations'
        exclude group: 'com.fasterxml.jackson.module', module: 'jackson-module-kotlin'
    }
    
    // Apache Commons Codec - Base64编码支持
    implementation 'commons-codec:commons-codec:1.15'
    
    // Apache Commons Lang3 - StringUtils支持
    implementation 'org.apache.commons:commons-lang3:3.12.0'
    
    // Apache Commons Text - StringUtils支持
    implementation 'org.apache.commons:commons-text:1.10.0'
    
    // HTTP客户端支持
    implementation 'org.apache.httpcomponents:httpclient:4.5.13'
    
    // 移除Jackson依赖，使用IDE内部的Jackson
    // implementation 'com.fasterxml.jackson.core:jackson-databind:2.13.4'
    
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
    
    // 测试依赖
    testImplementation 'org.mockito:mockito-inline:4.6.1'  // 支持静态方法mock
    testImplementation 'org.mockito:mockito-junit-jupiter:4.6.1'
    testImplementation('org.springframework:spring-test:5.3.23') {
        exclude group: 'com.fasterxml.jackson.core', module: 'jackson-core'
        exclude group: 'com.fasterxml.jackson.core', module: 'jackson-databind'
        exclude group: 'com.fasterxml.jackson.core', module: 'jackson-annotations'
        exclude group: 'com.fasterxml.jackson.module', module: 'jackson-module-kotlin'
    }
    
    // 日志依赖
    implementation 'org.slf4j:slf4j-api:1.7.36'
    testImplementation 'ch.qos.logback:logback-classic:1.2.12'
    implementation 'cn.hutool:hutool-json:5.8.22'
}

// 配置IntelliJ IDEA插件
intellij {
    version = '2019.3.5'
    type = 'IC'
    pluginName = 'DingCoder-AI'
    plugins = ['java']
    updateSinceUntilBuild = false
    downloadSources = false
}

buildSearchableOptions {
    enabled = false
}

patchPluginXml {
    sinceBuild = '203'
    untilBuild = '241.*'
}

test {
    useJUnitPlatform()
}

// 修改默认任务以避免插件验证错误
runIde {
    jvmArgs = ['-Xmx1024m']
}

// 配置打包任务，优化输出插件
buildPlugin {
    from("$buildDir/libs") {
        into("lib")
    }
}

// 清理时也清理IDE运行产生的数据
cleanTest.doFirst {
    delete "$projectDir/build/idea-sandbox"
}

// 添加运行控制台登录测试的任务
task runLoginTest(type: JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    main = 'com.codereview.plugin.auth.LoginConsoleTest'
    standardInput = System.in
    
    // 添加JVM参数
    jvmArgs = ['-Xmx1024m']
} 